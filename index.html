<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#050505">

<title>Welcome | Team Wolfpack</title>

<style>

/* =====================================
   RESET
===================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: #050505;
  font-family: Arial, sans-serif;
}

/* =====================================
   WELCOME SCREEN
===================================== */

.welcome-screen {
  position: relative;

  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;

  background: #050505;
}

/* =====================================
   WELCOME ARTWORK
===================================== */

.welcome-image {
  display: block;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  object-fit: contain;

  animation: welcomeFade 1s ease-out both;
}

@keyframes welcomeFade {
  from {
    opacity: 0;
    transform: scale(1.025);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* =====================================
   TEAM WOLFPACK GLOWING WOLF EYES
===================================== */

/* POSITION EFFECTS OVER WELCOME ARTWORK */

.wolf-eye-effects {
  position: absolute;

  width: min(100vw, 56.25dvh);
  height: min(177.7778vw, 100dvh);

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  pointer-events: none;

  z-index: 5;
}

/* =====================================
   SHARED GLOWING EYE EFFECT
===================================== */

.wolf-eye {
  position: absolute;

  width: 2.5%;
  aspect-ratio: 1;

  border-radius: 50%;

  filter: blur(3px);

  opacity: 1;

  mix-blend-mode: screen;

  animation: wolfEyePulse 2s ease-in-out infinite alternate;
}

/* =====================================
   LEFT EYE — ELECTRIC ICY BLUE
===================================== */

.wolf-eye-ice {
  left: 43.6%;
  top: 37.5%;

  background: #b9f6ff;

  box-shadow:
    0 0 8px 4px #ffffff,
    0 0 18px 8px #00bfff,
    0 0 35px 14px rgba(0,191,255,0.9),
    0 0 60px 20px rgba(0,100,255,0.6);
}

/* =====================================
   RIGHT EYE — FIERY ORANGE
===================================== */

.wolf-eye-fire {
  left: 55.5%;
  top: 37.5%;

  background: #fff0a0;

  box-shadow:
    0 0 8px 4px #ffffff,
    0 0 18px 8px #ff6500,
    0 0 35px 14px rgba(255,100,0,0.9),
    0 0 60px 20px rgba(255,40,0,0.6);
}

/* =====================================
   POWERFUL PULSING ANIMATION
===================================== */

@keyframes wolfEyePulse {

  0% {
    opacity: 0.55;
    transform: scale(0.85);
  }

  100% {
    opacity: 1;
    transform: scale(1.35);
  }

}

/* =====================================
   ACCESSIBILITY
===================================== */

@media (prefers-reduced-motion: reduce) {

  .wolf-eye {
    animation: none;
  }

}
  
/* =====================================
   ENTER BUTTON
===================================== */

.enter-button {
  position: absolute;

  left: 50%;
  top: 73%;

  transform: translate(-50%, -50%);

  width: min(76%, 400px);
  height: 8%;
  min-height: 45px;

  z-index: 10;

  border-radius: 12px;

  background: transparent;
  border: none;

  cursor: pointer;
  text-decoration: none;

  -webkit-tap-highlight-color: transparent;
}

.enter-button:focus-visible {
  outline: 3px solid #67dcff;
  outline-offset: 5px;
}

/* =====================================
   ICE & FIRE TRANSITION
===================================== */

.transition-overlay {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: flex;

  overflow: hidden;

  pointer-events: none;

  visibility: hidden;
}

/* ICE — LEFT */

.transition-ice {
  position: absolute;

  top: 0;
  left: -55%;

  width: 55%;
  height: 100%;

  background:
    linear-gradient(
      110deg,
      #001b35 0%,
      #006fa8 35%,
      #00bfff 70%,
      #b8f5ff 100%
    );

  box-shadow:
    0 0 60px rgba(0,191,255,.85),
    0 0 120px rgba(0,191,255,.45);

  transform: translateX(0);
}

/* FIRE — RIGHT */

.transition-fire {
  position: absolute;

  top: 0;
  right: -55%;

  width: 55%;
  height: 100%;

  background:
    linear-gradient(
      250deg,
      #350500 0%,
      #a82a00 35%,
      #ff6500 70%,
      #ffd080 100%
    );

  box-shadow:
    0 0 60px rgba(255,100,0,.85),
    0 0 120px rgba(255,100,0,.45);

  transform: translateX(0);
}

/* CENTRE ENERGY FLASH */

.transition-flash {
  position: absolute;

  inset: 0;

  opacity: 0;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.95) 0%,
      rgba(150,230,255,.65) 12%,
      rgba(255,130,30,.35) 28%,
      transparent 65%
    );
}

/* =====================================
   ACTIVATE TRANSITION
===================================== */

.transition-overlay.active {
  visibility: visible;
}

.transition-overlay.active .transition-ice {
  animation: iceSweep 1.2s ease-in-out forwards;
}

.transition-overlay.active .transition-fire {
  animation: fireSweep 1.2s ease-in-out forwards;
}

.transition-overlay.active .transition-flash {
  animation: energyFlash 1.2s ease-in-out forwards;
}

/* ICE SWEEP */

@keyframes iceSweep {
  0% {
    transform: translateX(0);
  }

  65% {
    transform: translateX(100%);
  }

  100% {
    transform: translateX(100%);
  }
}

/* FIRE SWEEP */

@keyframes fireSweep {
  0% {
    transform: translateX(0);
  }

  65% {
    transform: translateX(-100%);
  }

  100% {
    transform: translateX(-100%);
  }
}

/* ENERGY FLASH */

@keyframes energyFlash {
  0%, 45% {
    opacity: 0;
  }

  65% {
    opacity: 1;
  }

  100% {
    opacity: 0;
  }
}

/* =====================================
   TEAM WOLFPACK ICE & FIRE PARTICLES
===================================== */

.wolfpack-particles {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}

/* =====================================
   BRIGHTER ICE & FIRE PARTICLES
===================================== */

/* SHARED PARTICLE SETTINGS */

.particle {
  position: absolute;

  left: var(--x);
  top: var(--y);

  width: 12px;
  height: 12px;

  opacity: 0;

  z-index: 10;

  will-change: transform, opacity;
}

/* =====================================
   ELECTRIC ICE CRYSTALS
===================================== */

.ice-particle {
  background: #e8fcff;

  border: 2px solid #ffffff;

  clip-path: polygon(
    50% 0%,
    100% 50%,
    50% 100%,
    0% 50%
  );

  filter:
    drop-shadow(0 0 5px #ffffff)
    drop-shadow(0 0 12px #00bfff)
    drop-shadow(0 0 20px #008cff);

  box-shadow:
    0 0 15px 5px #00bfff,
    0 0 30px 10px rgba(0,191,255,.9);
}

/* =====================================
   FIERY ORANGE EMBERS
===================================== */

.fire-particle {
  background:
    radial-gradient(
      circle,
      #ffffff 0%,
      #fff2a0 25%,
      #ff9a00 55%,
      #ff4500 100%
    );

  border-radius: 50%;

  filter:
    drop-shadow(0 0 6px #ffffff)
    drop-shadow(0 0 14px #ff6500)
    drop-shadow(0 0 22px #ff3300);

  box-shadow:
    0 0 15px 5px #ff6500,
    0 0 30px 10px rgba(255,100,0,.9);
}

/* ACTIVATE PARTICLES WHEN ENTER IS PRESSED */

.transition-overlay.active .ice-particle {
  animation: iceParticleSweep 1.2s ease-out var(--delay) both;
}

.transition-overlay.active .fire-particle {
  animation: fireParticleSweep 1.2s ease-out var(--delay) both;
}

/* ICE MOVES FROM LEFT TOWARDS CENTRE */

@keyframes iceParticleSweep {

  0% {
    opacity: 0;
    transform: translateX(-40px) rotate(0deg) scale(.5);
  }

  25% {
    opacity: 1;
  }

  75% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translateX(45vw) rotate(360deg) scale(1.5);
  }

}

/* FIRE MOVES FROM RIGHT TOWARDS CENTRE */

@keyframes fireParticleSweep {

  0% {
    opacity: 0;
    transform: translateX(40px) scale(.5);
  }

  25% {
    opacity: 1;
  }

  75% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translateX(-45vw) scale(1.5);
  }

}

/* REDUCED MOTION SUPPORT */

@media (prefers-reduced-motion: reduce) {

  .transition-overlay.active .ice-particle,
  .transition-overlay.active .fire-particle {
    animation: none;
  }

}
  
/* =====================================
   DESKTOP ADJUSTMENTS
===================================== */

@media (min-aspect-ratio: 9/16) {

  .welcome-image {
    width: auto;
    max-width: 100%;
    height: 100dvh;
  }

  .enter-button {
    top: 73%;
    width: min(42%, 400px);
  }

}

/* =====================================
   ACCESSIBILITY
===================================== */

@media (prefers-reduced-motion: reduce) {

  .welcome-image {
    animation: none;
  }

  .transition-overlay.active .transition-ice,
  .transition-overlay.active .transition-fire,
  .transition-overlay.active .transition-flash {
    animation: none;
  }

}

/* =====================================
   TEAM WOLFPACK CINEMATIC WOLF ENTRANCE
===================================== */

.wolf-entrance {
  position: fixed;
  inset: 0;

  z-index: 9999;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.wolf-entrance.active {
  opacity: 1;
  visibility: visible;
}

/* CINEMATIC WOLF IMAGE — DESKTOP & MOBILE */

.wolf-entrance-image {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center;

  transform: scale(1);
}
.wolf-entrance.active .wolf-entrance-image {
  animation: wolfCinematicZoom var(--wolf-animation-duration, 6s) ease-in-out forwards;
}

/* =====================================
   CINEMATIC WOLF — NO CROPPING
===================================== */

@keyframes wolfCinematicZoom {

  0% {
    transform: scale(1);
    filter: brightness(0.15);
  }

  25% {
    transform: scale(1);
    filter: brightness(0.7);
  }

  65% {
    transform: scale(1);
    filter: brightness(1.15);
  }

  100% {
    transform: scale(1);
    filter: brightness(0);
  }

}

.wolf-entrance-shade {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.25),
    transparent 45%,
    rgba(0,0,0,0.35)
  );
}

@media (prefers-reduced-motion: reduce) {
  .wolf-entrance.active .wolf-entrance-image {
    animation: none;
    filter: brightness(1);
  }
}
  
</style>
</head>

<body>

<main class="welcome-screen">

  <!-- WELCOME ARTWORK -->

  <img
    src="team-wolfpack-welcome.png"
    alt="Team Wolfpack — One Pack, One Purpose"
    class="welcome-image"
  >

  <!-- TEAM WOLFPACK GLOWING WOLF EYES -->

<div class="wolf-eye-effects" aria-hidden="true">

  <!-- ELECTRIC ICE BLUE EYE -->
  <span class="wolf-eye wolf-eye-ice"></span>

  <!-- FIERY ORANGE EYE -->
  <span class="wolf-eye wolf-eye-fire"></span>

</div>
  
  <!-- ENTER BUTTON -->

  <a
    href="home.html"
    class="enter-button"
    id="enterWolfpack"
    aria-label="Enter Team Wolfpack App"
  ></a>

</main>

<!-- =====================================
     TEAM WOLFPACK CINEMATIC ENTRANCE
===================================== -->

<div
  id="wolfEntrance"
  class="wolf-entrance"
  aria-hidden="true"
>

  <img
    src="wolf-entrance.png"
    alt=""
    class="wolf-entrance-image"
  >

  <div class="wolf-entrance-shade"></div>

</div>
  
<!-- TEAM WOLFPACK CINEMATIC WOLF HOWL -->

<audio
  id="wolfHowl"
  src="wolf-howl.mp3"
  preload="auto"
></audio>
  
<!-- ICE & FIRE TRANSITION -->

<div
  class="transition-overlay"
  id="wolfpackTransition"
  aria-hidden="true"
>

  <div class="transition-ice"></div>

  <div class="transition-fire"></div>

<!-- ANIMATED ICE & FIRE PARTICLES -->

<div class="wolfpack-particles" aria-hidden="true">

  <!-- ELECTRIC ICE CRYSTALS -->

  <div class="particle ice-particle" style="--x:8%;--y:12%;--delay:0s"></div>
  <div class="particle ice-particle" style="--x:18%;--y:28%;--delay:.1s"></div>
  <div class="particle ice-particle" style="--x:6%;--y:45%;--delay:.2s"></div>
  <div class="particle ice-particle" style="--x:24%;--y:62%;--delay:.05s"></div>
  <div class="particle ice-particle" style="--x:12%;--y:78%;--delay:.15s"></div>
  <div class="particle ice-particle" style="--x:32%;--y:88%;--delay:.25s"></div>

  <!-- FIERY ORANGE EMBERS -->

  <div class="particle fire-particle" style="--x:92%;--y:15%;--delay:0s"></div>
  <div class="particle fire-particle" style="--x:82%;--y:32%;--delay:.1s"></div>
  <div class="particle fire-particle" style="--x:94%;--y:48%;--delay:.2s"></div>
  <div class="particle fire-particle" style="--x:76%;--y:65%;--delay:.05s"></div>
  <div class="particle fire-particle" style="--x:88%;--y:82%;--delay:.15s"></div>
  <div class="particle fire-particle" style="--x:68%;--y:92%;--delay:.25s"></div>

</div>
  
  <div class="transition-flash"></div>

</div>

<style>
#introVideoOverlay{position:fixed;inset:0;z-index:99999;background:#000;display:none;align-items:center;justify-content:center}
#introVideoOverlay.active{display:flex}
#introVideo{width:100%;height:100%;object-fit:contain;background:#000}
#skipIntro{position:absolute;top:max(18px,env(safe-area-inset-top));right:20px;z-index:2;background:rgba(0,0,0,.78);border:1px solid #4acaff;border-radius:9px;color:white;font:700 14px Arial,sans-serif;letter-spacing:1px;padding:13px 19px;cursor:pointer}
#introStatus{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.7);font:14px Arial,sans-serif;padding:10px 16px;border-radius:8px;text-align:center}
</style>
<div id="introVideoOverlay" aria-hidden="true">
  <video id="introVideo" playsinline preload="none"></video>
  <button id="skipIntro" type="button">SKIP INTRO →</button>
  <div id="introStatus" role="status">Loading Team Wolfpack intro...</div>
</div>
<script>
const enterButton = document.getElementById("enterWolfpack");
const introOverlay = document.getElementById("introVideoOverlay");
const introVideo = document.getElementById("introVideo");
const skipIntro = document.getElementById("skipIntro");
const introStatus = document.getElementById("introStatus");
const introSource = "https://firebasestorage.googleapis.com/v0/b/team-wolfpack-app.firebasestorage.app/o/opening-video%2FTeam%20Wolfpack%20Opening%20Video.mp4?alt=media&token=e66413ef-fad7-487d-978c-dfccc3244813";
let entering = false;
let introTimeout;
function openWolfpackHome(){
  clearTimeout(introTimeout);
  window.location.assign("welcome-to-pack.html");
}
skipIntro.addEventListener("click", openWolfpackHome);
introVideo.addEventListener("ended", openWolfpackHome);
introVideo.addEventListener("playing", () => { introStatus.style.display = "none"; });
introVideo.addEventListener("error", () => {
  introStatus.textContent = "Video unavailable. Opening Team Wolfpack...";
  setTimeout(openWolfpackHome, 1200);
});
enterButton.addEventListener("click", async (event) => {
  if(event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button !== 0) return;
  event.preventDefault();
  if(entering) return;
  entering = true;
  introOverlay.classList.add("active");
  introOverlay.setAttribute("aria-hidden","false");
  introVideo.src = introSource;
  introVideo.volume = 1;
  introVideo.muted = false;
  introVideo.load();
  introTimeout = setTimeout(() => {
    if(introVideo.paused || introVideo.readyState < 2) openWolfpackHome();
  }, 18000);
  try {
    await introVideo.play();
  } catch (error) {
    introStatus.textContent = "Tap play to watch, or skip the intro.";
    introVideo.controls = true;
    introVideo.muted = true;
    try { await introVideo.play(); } catch(e) { /* Manual play and skip remain available */ }
  }
});
</script>

</body>
</html>
