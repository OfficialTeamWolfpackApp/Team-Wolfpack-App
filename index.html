<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050505">

<title>Welcome | Team Wolfpack</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #050505;
  font-family: Arial, sans-serif;
}

.welcome-screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
  background: #050505;
}

.welcome-image {
  display: block;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  object-fit: contain;
}

.enter-button {
  position: absolute;

  left: 50%;
  top: 73%;

  transform: translate(-50%, -50%);

  width: min(76%, 400px);
  height: 8%;

  min-height: 45px;

  z-index: 10;

  border-radius: 12px;

  background: transparent;
  border: none;

  cursor: pointer;

  text-decoration: none;
}

.enter-button:focus-visible {
  outline: 3px solid #67dcff;
  outline-offset: 5px;
}

@media (min-aspect-ratio: 9/16) {

  .welcome-image {
    width: auto;
    max-width: 100%;
    height: 100dvh;
  }

  .enter-button {
    top: 73%;
    width: min(42%, 400px);
  }

}

</style>
</head>

<body>

<main class="welcome-screen">

  <img
    src="team-wolfpack-welcome.png"
    alt="Team Wolfpack — One Pack, One Purpose"
    class="welcome-image"
  >

<a
  href="home.html"
  class="enter-button"
  aria-label="Enter Team Wolfpack App"
></a>

</main>

</body>
</html>
