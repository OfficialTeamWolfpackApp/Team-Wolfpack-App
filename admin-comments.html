<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Comments Management | Team Wolfpack</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#092b3b,transparent 45%),radial-gradient(circle at top right,#381b0d,transparent 45%),#050709;color:#f5faff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px 16px 70px}a{color:#79dbff}.back{display:inline-block;margin-bottom:22px;text-decoration:none;font-weight:bold}h1{font-size:clamp(25px,5vw,40px);margin:0 0 8px}h1 span{color:#69d8ff}.sub{color:#b4c7d3;margin:0 0 24px}.status{border:1px solid #426277;background:#071821;padding:16px;border-radius:12px;margin-bottom:18px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#0d1b24;border:1px solid #375064;border-radius:12px;padding:16px;flex:1;min-width:140px}.stat strong{display:block;font-size:26px;color:#70d8ff}.card{border:1px solid #355267;border-radius:14px;background:#0c151c;padding:18px;margin:14px 0;overflow-wrap:anywhere}.title{color:#77d8ff;font-size:18px;font-weight:bold}.meta{color:#afbfca;font-size:12px;margin:9px 0}.message{white-space:pre-wrap;line-height:1.55}.delete{border:1px solid #f98049;background:#431a0d;color:white;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold}.delete:disabled{opacity:.5}.empty{padding:20px;color:#bed2df}#content[hidden]{display:none}
</style></head><body><main class="wrap"><a class="back" href="admin-dashboard.html">← ADMIN DASHBOARD</a><h1>💬 <span>COMMENTS</span> MANAGEMENT</h1><p class="sub">Team Wolfpack • Live Updates moderation</p><div id="status" class="status">Checking administrator access…</div><section id="content" hidden><div class="stats"><div class="stat"><strong id="total">0</strong>COMMENTS</div><div class="stat"><strong id="posts">0</strong>UPDATES WITH COMMENTS</div></div><div id="list" aria-live="polite"></div></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getDatabase,ref,onValue,remove}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
const config={apiKey:"AIzaSyC06RDrqpXodbYBJqyeGvRkmtxQGapaaPY",authDomain:"team-wolfpack-app.firebaseapp.com",databaseURL:"https://team-wolfpack-app-default-rtdb.europe-west1.firebasedatabase.app",projectId:"team-wolfpack-app",storageBucket:"team-wolfpack-app.firebasestorage.app",messagingSenderId:"1070414578856",appId:"1:1070414578856:web:df14e7d387e658eeae2e9d"};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),admins=new Set(["PRGa9TsCW0QDn1QtoUXyYjEi7YB3","SlpEQYl94DaH6j42QUyl8Kv2ujJ3"]);
const status=document.getElementById("status"),content=document.getElementById("content"),list=document.getElementById("list");let unsubs=[],comments={},updates={};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(){list.replaceChildren();let count=0,posts=0;for(const [updateId,group]of Object.entries(comments)){const entries=Object.entries(group||{});if(!entries.length)continue;posts++;for(const [commentId,c]of entries){count++;const card=el("article","card");const update=updates[updateId]||{};card.append(el("div","title",String(update.title||"Live Update").slice(0,150)),el("div","meta",String(c.name||"Supporter").slice(0,40)+" • "+(Number.isFinite(c.createdAt)?new Date(c.createdAt).toLocaleString("en-GB"):"Date unavailable")),el("p","message",String(c.message||"")));const btn=el("button","delete","DELETE COMMENT");btn.type="button";btn.onclick=async()=>{if(!confirm("Permanently delete this comment?"))return;btn.disabled=true;try{await remove(ref(db,"updateComments/"+updateId+"/"+commentId))}catch(err){alert("Unable to delete comment: "+(err.code||err.message));btn.disabled=false}};card.append(btn);list.append(card)}}document.getElementById("total").textContent=count;document.getElementById("posts").textContent=posts;if(!count)list.append(el("p","empty","No comments have been posted yet."))}
onAuthStateChanged(auth,user=>{unsubs.forEach(fn=>fn());unsubs=[];content.hidden=true;if(!user||!admins.has(user.uid)){status.textContent="Administrator access required. Sign in with an authorised Team Wolfpack admin account.";return}status.textContent="ADMIN ACCESS VERIFIED • LIVE COMMENTS";content.hidden=false;unsubs.push(onValue(ref(db,"updates"),snap=>{updates=snap.val()||{};render()},err=>{status.textContent="Could not load updates: "+err.code}));unsubs.push(onValue(ref(db,"updateComments"),snap=>{comments=snap.val()||{};render()},err=>{status.textContent="Could not load comments: "+err.code}))});
</script></body></html>
