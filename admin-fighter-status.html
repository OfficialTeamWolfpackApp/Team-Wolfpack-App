<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Fighter Status Manager | Team Wolfpack</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at left top,#073448,transparent 42%),radial-gradient(circle at right bottom,#481b07,transparent 40%),#050505;color:white;font-family:Arial,sans-serif}.wrap{max-width:780px;margin:auto;padding:28px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#7be3ff;text-decoration:none;font-weight:bold;font-size:12px}h1{font-size:clamp(22px,5vw,32px);margin:26px 0 5px}.sub{color:#aaa;font-size:12px;line-height:1.6}.card{margin-top:20px;padding:24px;border:1px solid #365263;border-left:3px solid #42d4ff;border-right:3px solid #ff711b;border-radius:16px;background:rgba(8,8,8,.9);box-shadow:0 12px 30px #0007}.badge{color:#7be3ff;font-size:11px;font-weight:900;letter-spacing:2px}label{display:block;margin:18px 0 7px;font-size:11px;font-weight:800;color:#ccc;letter-spacing:1px}input,select,textarea{width:100%;padding:13px;border:1px solid #40515a;border-radius:8px;background:#101820;color:white;font-size:14px}textarea{min-height:80px;resize:vertical}.preview{margin-top:22px;padding:20px;border:1px solid #2c3b42;border-radius:12px;text-align:center;background:linear-gradient(105deg,#062a3d,#090909 48%,#351307)}.preview strong{display:block;margin:10px 0;font-size:23px}.preview .status{color:#83e5ff;font-weight:900;letter-spacing:2px}.preview .motto{color:#ffad72;font-size:12px}.btn{display:block;width:100%;margin-top:20px;padding:15px;background:linear-gradient(90deg,#007aa8,#19222a 48%,#b64c12);border:1px solid #76dfff;border-radius:9px;color:white;font-weight:900;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{margin-top:15px;font-size:12px;line-height:1.5;color:#aaa}.success{color:#70ffad}.error{color:#ff927d}[hidden]{display:none!important}</style></head>
<body><main class="wrap"><div class="top"><a class="back" href="admin-dashboard.html">← ADMIN DASHBOARD</a><span class="badge">TEAM WOLFPACK</span></div><h1>🐺 FIGHTER STATUS MANAGER</h1><p class="sub">Control each fighter's promotional status. Existing fight records are not changed.</p><p id="authStatus" class="notice">Checking administrator access…</p>
<section id="manager" class="card" hidden><span class="badge">THE HUNT CONTINUES</span><label for="fighter">FIGHTER</label><select id="fighter"><option value="mrs-wolfie">MRS WOLFIE — TEAM WOLFIE</option><option value="greig-sloan">GREIG SLOAN — TEAM SLOAN</option></select><label for="status">FIGHTER STATUS</label><select id="status"><option value="hunt">THE HUNT CONTINUES</option><option value="incoming">FIGHT ANNOUNCEMENT INCOMING</option><option value="confirmed">FIGHT CONFIRMED</option></select><label for="message">PROMOTIONAL MESSAGE</label><textarea id="message" maxlength="220" placeholder="The work doesn't stop when the ring is quiet."></textarea><div class="preview" aria-live="polite"><span class="badge" id="previewTeam">TEAM WOLFIE</span><strong id="previewName">MRS WOLFIE</strong><div class="status" id="previewStatus">THE HUNT CONTINUES</div><p id="previewMessage"></p><div class="motto" id="previewMotto">HUNT WITHOUT FEAR</div></div><button id="save" class="btn" disabled>SAVE FIGHTER STATUS</button><p id="result" class="notice" role="status">Select a fighter to load their saved status.</p></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getDatabase,ref,get,set} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const app=initializeApp({apiKey:'AIzaSyC06RDrqpXodbYBJqyeGvRkmtxQGapaaPY',authDomain:'team-wolfpack-app.firebaseapp.com',databaseURL:'https://team-wolfpack-app-default-rtdb.europe-west1.firebasedatabase.app',projectId:'team-wolfpack-app',storageBucket:'team-wolfpack-app.firebasestorage.app',messagingSenderId:'1070414578856',appId:'1:1070414578856:web:df14e7d387e658eeae2e9d'});
const db=getDatabase(app),auth=getAuth(app);
const ADMINS=new Set(['PRGa9TsCW0QDn1QtoUXyYjEi7YB3','SlpEQYl94DaH6j42QUyl8Kv2ujJ3']);
const fighters={'mrs-wolfie':{name:'MRS WOLFIE',team:'TEAM WOLFIE',motto:'HUNT WITHOUT FEAR',profile:'mrs-wolfie.html',image:'zoey-james.jpg'},'greig-sloan':{name:'GREIG SLOAN',team:'TEAM SLOAN',motto:'THE AWAKENING',profile:'greig-sloan.html',image:'greig-sloan.jpg'}};
const labels={hunt:'THE HUNT CONTINUES',incoming:'FIGHT ANNOUNCEMENT INCOMING',confirmed:'FIGHT CONFIRMED'};
const $=id=>document.getElementById(id);let authorised=false;let loadToken=0;
function preview(){const f=fighters[$('fighter').value];$('previewTeam').textContent=f.team;$('previewName').textContent=f.name;$('previewMotto').textContent=f.motto;$('previewStatus').textContent=labels[$('status').value];$('previewMessage').textContent=$('message').value.trim()||'The work doesn\'t stop when the ring is quiet.';}
async function load(){if(!authorised)return;const token=++loadToken,key=$('fighter').value;$('save').disabled=true;$('result').textContent='Loading saved fighter status…';$('message').value='';$('status').value='hunt';preview();try{const snap=await get(ref(db,'fighterStatuses/'+key));if(token!==loadToken)return;const data=snap.val()||{};$('status').value=labels[data.status]?data.status:'hunt';$('message').value=String(data.message||'');$('result').textContent=snap.exists()?'Saved status loaded.':'No saved status yet. Choose a status and save.';$('save').disabled=false;preview();}catch(e){if(token!==loadToken)return;$('result').textContent='Unable to load status: '+e.message;$('result').className='notice error';}}
$('fighter').addEventListener('change',load);$('status').addEventListener('change',preview);$('message').addEventListener('input',preview);
$('save').addEventListener('click',async()=>{if(!authorised||!auth.currentUser||!ADMINS.has(auth.currentUser.uid))return;const key=$('fighter').value,f=fighters[key];$('save').disabled=true;$('result').className='notice';$('result').textContent='Saving…';try{await set(ref(db,'fighterStatuses/'+key),{fighterId:key,name:f.name,team:f.team,profile:f.profile,image:f.image,motto:f.motto,status:$('status').value,message:$('message').value.trim(),updatedAt:Date.now(),updatedBy:auth.currentUser.uid});$('result').textContent='✓ Fighter status saved to Firebase.';$('result').className='notice success';}catch(e){$('result').textContent='Save failed: '+e.message+'. Check Firebase database write rules.';$('result').className='notice error';}finally{$('save').disabled=false;}});
onAuthStateChanged(auth,user=>{authorised=!!user&&ADMINS.has(user.uid);$('manager').hidden=!authorised;$('authStatus').textContent=authorised?'✓ AUTHORISED ADMIN — '+(user.email||'SIGNED IN'):'ADMIN ACCESS REQUIRED — Sign in through your existing admin dashboard.';$('authStatus').className='notice '+(authorised?'success':'error');if(authorised)load();});
</script></body></html>
