<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#05080c">

  <title>Meet Our Pack | Team Wolfpack</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #f6faff;
      font-family: Arial, sans-serif;
      min-height: 100dvh;

      background:
        radial-gradient(
          ellipse at 0 10%,
          #003b58,
          transparent 45%
        ),
        radial-gradient(
          ellipse at 100% 95%,
          #602400,
          transparent 50%
        ),
        #05080d;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 28px 16px 70px;
      text-align: center;
    }

    .logo {
      width: 78px;
      height: 78px;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(26px, 5vw, 42px);
      letter-spacing: 2px;
      margin: 12px 0 8px;
    }

    h1 span {
      color: #ff8529;
    }

    .tag {
      color: #9fe3ff;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 12px;
    }

    .desc {
      color: #b8cbd5;
      font-size: 14px;
      line-height: 1.5;
      margin: 18px auto;
      max-width: 600px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 24px auto;
    }

    .actions a {
      padding: 12px 18px;
      text-decoration: none;
      color: #fff;
      border: 1px solid #38c9ff;
      border-radius: 10px;
      font-weight: bold;
      background: #08263a;
    }

    .actions a:nth-child(2) {
      border-color: #ff8529;
    }

    #status {
      color: #a9d7e9;
      margin: 25px auto;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(185px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .member {
      display: block;
      min-width: 0;
      color: #fff;
      text-decoration: none;

      background:
        linear-gradient(
          140deg,
          #091d2a,
          #111a22 65%,
          #321a0e
        );

      border: 1px solid #28657d;
      border-radius: 18px;
      padding: 22px 12px;
      box-shadow: 0 10px 28px #0007;

      transition:
        transform 0.2s,
        border-color 0.2s;
    }

    .member:hover,
    .member:focus-visible {
      transform: translateY(-3px);
      border-color: #ff943c;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 3px solid #40caff;

      box-shadow:
        0 0 0 2px #ff8529,
        0 0 18px #ff852945;

      margin: 0 auto 15px;

      display: grid;
      place-items: center;

      font-size: 54px;
      object-fit: cover;
      background: #102937;
    }

    .name {
      font-size: 18px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .joined {
      font-size: 12px;
      color: #c0d2dc;
      margin: 10px 0;
    }

    .counts {
      display: flex;
      justify-content: center;
      gap: 16px;
      color: #a6e6ff;
      font-size: 12px;
      font-weight: bold;
    }

    /* STEP 1778J — SUPPORTER DIRECTORY POLISH */
    .member {
      position: relative;
      overflow: hidden;
      outline-offset: 4px;
    }
    .member::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00bfff, #eafaff 50%, #ff751c);
    }
    .member:focus-visible {
      outline: 3px solid #9fe3ff;
    }
    .member .name {
      line-height: 1.3;
      min-height: 2.6em;
    }
    .member .counts {
      flex-wrap: wrap;
      line-height: 1.5;
      padding-top: 5px;
    }
    .member .view-profile {
      display: block;
      margin-top: 15px;
      color: #ffab66;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
    }
    @media (prefers-reduced-motion: reduce) {
      .member { transition: none; }
    }

    .back {
      display: inline-block;
      color: #8ce1ff;
      margin-top: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 440px) {
      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .member {
        padding: 17px 8px;
      }

      .avatar {
        width: 92px;
        height: 92px;
      }

      .name {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main>

    <img
      class="logo"
      src="icon-192.png"
      alt="Team Wolfpack"
    >

    <h1>
      MEET OUR <span>PACK</span>
    </h1>

    <p class="tag">
      ONE PACK • ONE PURPOSE
    </p>

    <p class="desc">
      Meet the verified Team Wolfpack members.
      Tap a member to view their public profile.
    </p>

    <div class="actions">

      <a href="supporter-account.html">
        👤 MY PROFILE / SIGN IN
      </a>

      <a href="home.html">
        🐺 TEAM WOLFPACK HOME
      </a>

    </div>

    <p id="status" role="status">
      Loading our pack…
    </p>

    <section
      id="grid"
      class="grid"
      aria-label="Registered Team Wolfpack supporters"
    ></section>

    <a class="back" href="home.html">
      ← BACK TO TEAM WOLFPACK
    </a>

  </main>

  <!-- FIREBASE INTEGRATION -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getDatabase,
      ref,
      get
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

    import {
      getStorage,
      ref as storageRef,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyC06RDrqpXodbYBJqyeGvRkmtxQGapaaPY",

      authDomain:
        "team-wolfpack-app.firebaseapp.com",

      databaseURL:
        "https://team-wolfpack-app-default-rtdb.europe-west1.firebasedatabase.app",

      projectId:
        "team-wolfpack-app",

      storageBucket:
        "team-wolfpack-app.firebasestorage.app",

      messagingSenderId:
        "1070414578856",

      appId:
        "1:1070414578856:web:df14e7d387e658eeae2e9d"

    };


    /* =========================
       INITIALISE FIREBASE
    ========================= */

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const storage = getStorage(app);

    const grid = document.getElementById("grid");

    const status = document.getElementById("status");


    /* =========================
       CREATE HTML ELEMENT
    ========================= */

    function el(tag, cls, txt) {

      const element = document.createElement(tag);

      if (cls) {
        element.className = cls;
      }

      if (txt !== undefined) {
        element.textContent = txt;
      }

      return element;
    }


    /* =========================
       LOAD MEMBER PHOTOGRAPH
    ========================= */

    async function loadMemberPhoto(uid, name, avatar) {

      try {

        const photoReference = storageRef(
          storage,
          "supporter-avatars/" + uid + "/profile.webp"
        );

        const photoURL = await getDownloadURL(
          photoReference
        );

        const image = el("img", "avatar");

        image.alt = name + " profile photograph";

        image.onload = function () {

          avatar.replaceWith(image);

        };

        image.onerror = function () {

          console.warn(
            "Unable to display profile photograph:",
            uid
          );

        };

        image.src = photoURL;

      } catch (error) {

        console.warn(
          "Profile photograph unavailable:",
          uid,
          error.code || error.message
        );

      }

    }


    /* =========================
       LOAD REGISTERED MEMBERS
    ========================= */

    async function loadMembers() {

      try {

        const snapshot = await get(
          ref(db, "publicSupporterProfiles")
        );

        const members = Object.entries(
          snapshot.val() || {}
        )

        .filter(([uid, profile]) => {

          return (
            /^[A-Za-z0-9]{10,128}$/.test(uid) &&
            profile &&
            typeof profile.name === "string" &&
            Number.isFinite(profile.joinedAt)
          );

        })

        .sort((a, b) => {

          return a[1].joinedAt - b[1].joinedAt;

        });


        /* =========================
           EMPTY MEMBER LIST
        ========================= */

        if (!members.length) {

          status.textContent =
            "No members listed yet. Verified members will appear when they sign in.";

          return;

        }


        /* =========================
           MEMBER COUNT
        ========================= */

        status.textContent =
          members.length +
          " PACK MEMBER" +
          (members.length === 1 ? "" : "S");


        const counts = new Map(

          members.map(([uid]) => [

            uid,

            {
              likes: 0,
              comments: 0
            }

          ])

        );


        /* =========================
           CREATE MEMBER CARDS
        ========================= */

        for (const [uid, profile] of members) {

          const card = el("a", "member");

          card.href =
            "supporter-profile.html?uid=" +
            encodeURIComponent(uid);


          /* DEFAULT AVATAR */

          const avatar = el(
            "div",
            "avatar",
            "🐺"
          );

          card.append(avatar);


          /* MEMBER NAME */

          const memberName = el(
            "div",
            "name",
            profile.name.slice(0, 40)
          );

          card.append(memberName);


          /* JOINING DATE */

          const joinedDate = new Date(
            profile.joinedAt
          );

          const joined = el(
            "div",
            "joined",
            "Joined " +
            joinedDate.toLocaleDateString(
              "en-GB",
              {
                day: "numeric",
                month: "short",
                year: "numeric"
              }
            )
          );

          card.append(joined);


          /* LIKES AND COMMENTS */

          const stats = el(
            "div",
            "counts",
            "❤️ —   💬 —"
          );

          card.append(stats);

          const viewProfile = el(
            "span",
            "view-profile",
            "VIEW SUPPORTER PROFILE →"
          );
          card.append(viewProfile);


          /* ADD CARD TO PAGE */

          grid.append(card);


          /* LOAD PROFILE PHOTOGRAPH */

          loadMemberPhoto(
            uid,
            profile.name,
            avatar
          );


          /* STORE STATS ELEMENT */

          counts.get(uid).stats = stats;

        }


        /* =========================
           LOAD MEMBER ACTIVITY
        ========================= */

        try {

          const updatesSnapshot = await get(
            ref(db, "updates")
          );

          const updateIds = Object.keys(
            updatesSnapshot.val() || {}
          );


          await Promise.all(

            updateIds.map(async (updateId) => {

              try {

                const likesSnapshot = await get(
                  ref(
                    db,
                    "updateLikes/" + updateId
                  )
                );

                const commentsSnapshot = await get(
                  ref(
                    db,
                    "updateComments/" + updateId
                  )
                );


                /* COUNT LIKES */

                for (
                  const uid of Object.keys(
                    likesSnapshot.val() || {}
                  )
                ) {

                  if (
                    counts.has(uid) &&
                    likesSnapshot.val()[uid] === true
                  ) {

                    counts.get(uid).likes++;

                  }

                }


                /* COUNT COMMENTS */

                for (
                  const comment of Object.values(
                    commentsSnapshot.val() || {}
                  )
                ) {

                  if (
                    comment &&
                    counts.has(comment.uid)
                  ) {

                    counts.get(
                      comment.uid
                    ).comments++;

                  }

                }

              } catch (error) {

                console.warn(
                  "Member activity unavailable:",
                  error
                );

              }

            })

          );


          /* =========================
             UPDATE MEMBER COUNTERS
          ========================= */

          for (const member of counts.values()) {

            member.stats.textContent =
              "❤️ " +
              member.likes +
              "   💬 " +
              member.comments;

          }

        } catch (error) {

          console.warn(
            "Activity totals unavailable:",
            error
          );

        }

      } catch (error) {

        status.textContent =
          "Unable to load pack members: " +
          (error.code || error.message);

      }

    }


    /* =========================
       START MEMBER DIRECTORY
    ========================= */

    loadMembers();

  </script>

</body>
</html>
