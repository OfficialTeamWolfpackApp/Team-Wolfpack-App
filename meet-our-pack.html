<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080c"><title>Meet Our Pack | Team Wolfpack</title><style>*{box-sizing:border-box}body{margin:0;color:#f6faff;font-family:Arial,sans-serif;min-height:100dvh;background:radial-gradient(ellipse at 0 10%,#003b58,transparent 45%),radial-gradient(ellipse at 100% 95%,#602400,transparent 50%),#05080d}main{max-width:1000px;margin:auto;padding:28px 16px 70px;text-align:center}.logo{width:78px;height:78px;object-fit:contain}h1{font-size:clamp(26px,5vw,42px);letter-spacing:2px;margin:12px 0 8px}h1 span{color:#ff8529}.tag{color:#9fe3ff;font-weight:bold;letter-spacing:2px;font-size:12px}.desc{color:#b8cbd5;font-size:14px;line-height:1.5;margin:18px auto;max-width:600px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px auto}.actions a{padding:12px 18px;text-decoration:none;color:#fff;border:1px solid #38c9ff;border-radius:10px;font-weight:bold;background:#08263a}.actions a:nth-child(2){border-color:#ff8529}#status{color:#a9d7e9;margin:25px auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:18px;margin-top:25px}.member{display:block;min-width:0;color:#fff;text-decoration:none;background:linear-gradient(140deg,#091d2a,#111a22 65%,#321a0e);border:1px solid #28657d;border-radius:18px;padding:22px 12px;box-shadow:0 10px 28px #0007;transition:transform .2s,border-color .2s}.member:hover,.member:focus-visible{transform:translateY(-3px);border-color:#ff943c}.avatar{width:112px;height:112px;border-radius:50%;border:3px solid #40caff;box-shadow:0 0 0 2px #ff8529,0 0 18px #ff852945;margin:0 auto 15px;display:grid;place-items:center;font-size:54px;object-fit:cover;background:#102937}.name{font-size:18px;font-weight:800;overflow-wrap:anywhere}.joined{font-size:12px;color:#c0d2dc;margin:10px 0}.counts{display:flex;justify-content:center;gap:16px;color:#a6e6ff;font-size:12px;font-weight:bold}.back{display:inline-block;color:#8ce1ff;margin-top:30px;text-decoration:none;font-weight:bold}@media(max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.member{padding:17px 8px}.avatar{width:92px;height:92px}.name{font-size:15px}}</style></head><body><main><img class="logo" src="icon-192.png" alt="Team Wolfpack"><h1>MEET OUR <span>PACK</span></h1><p class="tag">ONE PACK • ONE PURPOSE</p><p class="desc">Meet the verified Team Wolfpack members. Tap a member to view their public profile.</p><div class="actions"><a href="supporter-account.html">👤 MY PROFILE / SIGN IN</a><a href="home.html">🐺 TEAM WOLFPACK HOME</a></div><p id="status" role="status">Loading our pack…</p><section id="grid" class="grid" aria-label="Team Wolfpack members"></section><a class="back" href="home.html">← BACK TO TEAM WOLFPACK</a></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";import{getStorage,ref as storageRef,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";const app=initializeApp({apiKey:"AIzaSyC06RDrqpXodbYBJqyeGvRkmtxQGapaaPY",authDomain:"team-wolfpack-app.firebaseapp.com",databaseURL:"https://team-wolfpack-app-default-rtdb.europe-west1.firebasedatabase.app",projectId:"team-wolfpack-app",storageBucket:"team-wolfpack-app.firebasestorage.app",messagingSenderId:"1070414578856",appId:"1:1070414578856:web:df14e7d387e658eeae2e9d"});const db=getDatabase(app),storage=getStorage(app),grid=document.getElementById("grid"),status=document.getElementById("status");function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}async function load(){try{const snap=await get(ref(db,"publicSupporterProfiles"));const members=Object.entries(snap.val()||{}).filter(([uid,p])=>/^[A-Za-z0-9]{10,128}$/.test(uid)&&p&&typeof p.name==="string"&&Number.isFinite(p.joinedAt)).sort((a,b)=>a[1].joinedAt-b[1].joinedAt);if(!members.length){status.textContent="No members listed yet. Verified members will appear when they sign in.";return}status.textContent=members.length+" PACK MEMBER"+(members.length===1?"":"S");const counts=new Map(members.map(([uid])=>[uid,{likes:0,comments:0}]));for(const[uid,p]of members){const a=el("a","member");a.href="supporter-profile.html?uid="+encodeURIComponent(uid);const avatar=el("div","avatar","🐺");a.append(avatar);a.append(el("div","name",p.name.slice(0,40)));a.append(el("div","joined","Joined "+new Date(p.joinedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})));const stats=el("div","counts","❤️ —   💬 —");a.append(stats);grid.append(a);getDownloadURL(storageRef(storage,"supporter-avatars/"+uid+"/profile.webp")).then(url=>{const img=el("img","avatar");img.alt=p.name+" profile photograph";img.src=url;avatar.replaceWith(img)}).catch(()=>{});counts.get(uid).stats=stats}try{const updates=await get(ref(db,"updates"));await Promise.all(Object.keys(updates.val()||{}).map(async id=>{try{const [likes,comments]=await Promise.all([get(ref(db,"updateLikes/"+id)),get(ref(db,"updateComments/"+id))]);for(const uid of Object.keys(likes.val()||{}))if(counts.has(uid)&&likes.val()[uid]===true)counts.get(uid).likes++;for(const c of Object.values(comments.val()||{}))if(c&&counts.has(c.uid))counts.get(c.uid).comments++}catch(e){console.warn("Member activity unavailable:",e)}}));for(const v of counts.values())v.stats.textContent="❤️ "+v.likes+"   💬 "+v.comments}catch(e){console.warn("Activity totals unavailable:",e)}}catch(e){status.textContent="Unable to load pack members: "+(e.code||e.message)}}load();</script></body></html>
