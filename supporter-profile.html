<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050a11"><title>Supporter Profile | Team Wolfpack</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#f5faff;background:radial-gradient(ellipse at top left,#00374e,transparent 55%),radial-gradient(ellipse at bottom right,#512000,transparent 55%),#05090e}main{max-width:560px;margin:auto;padding:32px 18px 70px;text-align:center}.logo{width:72px;height:72px;object-fit:contain}h1{font-size:26px;letter-spacing:1px}h1 span{color:#ff8b31}.card{border:1px solid #24647b;background:#07131edb;border-radius:20px;padding:26px 20px;box-shadow:0 18px 45px #0008}.avatar{width:130px;height:130px;margin:8px auto 16px;border-radius:50%;border:4px solid #39caff;box-shadow:0 0 0 3px #ff8529,0 0 22px #ff85294a;object-fit:cover;background:#122c39}.fallback{display:flex;align-items:center;justify-content:center;font-size:62px}.hidden{display:none!important}#name{font-size:26px;margin:12px 0 7px;overflow-wrap:anywhere}.badge{color:#82dcff;font-weight:bold;font-size:13px;letter-spacing:1px}.joined{color:#b8cad5;font-size:13px;margin:20px 0}.stats{display:flex;gap:12px;margin-top:23px}.stat{flex:1;border:1px solid #315269;border-radius:12px;background:#0c1d29;padding:15px 8px;color:#bbcfdb;font-size:12px}.stat strong{display:block;color:#8bdfff;font-size:28px;margin-bottom:5px}.note{font-size:12px;color:#a7bac9;line-height:1.6}.back{display:inline-block;margin-top:25px;color:#91e1ff;text-decoration:none;font-weight:bold}#status{color:#ffc397;font-size:13px;line-height:1.5}</style></head><body><main><img class="logo" src="icon-192.png" alt="Team Wolfpack"><h1>MEET THE <span>PACK</span></h1><section class="card"><div id="avatarDefault" class="avatar fallback">🐺</div><img id="avatarImage" class="avatar hidden" alt="Supporter profile picture"><h2 id="name">Loading supporter…</h2><p class="badge">🐺 TEAM WOLFPACK SUPPORTER</p><p class="joined" id="joined"></p><div class="stats"><div class="stat"><strong id="likes">—</strong>LIKES</div><div class="stat"><strong id="comments">—</strong>COMMENTS</div></div><p id="status" role="status"></p><p class="note">Public supporter profiles show only a display name, profile picture, membership date and activity totals. Email addresses are never displayed.</p></section><a class="back" href="updates.html">← BACK TO LIVE UPDATES</a></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import {getStorage,ref as storageRef,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";
const app=initializeApp({apiKey:"AIzaSyC06RDrqpXodbYBJqyeGvRkmtxQGapaaPY",authDomain:"team-wolfpack-app.firebaseapp.com",databaseURL:"https://team-wolfpack-app-default-rtdb.europe-west1.firebasedatabase.app",projectId:"team-wolfpack-app",storageBucket:"team-wolfpack-app.firebasestorage.app",messagingSenderId:"1070414578856",appId:"1:1070414578856:web:df14e7d387e658eeae2e9d"});
const db=getDatabase(app),storage=getStorage(app),$=id=>document.getElementById(id);
const uid=new URLSearchParams(location.search).get("uid");
async function load(){if(!uid||!/^[a-zA-Z0-9]{10,128}$/.test(uid)){$("name").textContent="Profile not found";return}
try{const snap=await get(ref(db,"publicSupporterProfiles/"+uid));if(!snap.exists()){$("name").textContent="Profile not available";$("status").textContent="This supporter has not activated their public profile yet.";return}
const p=snap.val();$("name").textContent=String(p.name||"Supporter").slice(0,40);if(Number.isFinite(p.joinedAt))$("joined").textContent="Public profile created "+new Date(p.joinedAt).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
getDownloadURL(storageRef(storage,"supporter-avatars/"+uid+"/profile.webp")).then(url=>{$("avatarImage").src=url;$("avatarImage").classList.remove("hidden");$("avatarDefault").classList.add("hidden")}).catch(()=>{});
const updates=await get(ref(db,"updates"));const ids=Object.keys(updates.val()||{});let likes=0,comments=0;
await Promise.all(ids.map(async id=>{try{const [l,c]=await Promise.all([get(ref(db,"updateLikes/"+id+"/"+uid)),get(ref(db,"updateComments/"+id))]);if(l.val()===true)likes++;for(const x of Object.values(c.val()||{}))if(x&&x.uid===uid)comments++}catch(e){console.warn("Activity unavailable",e)}}));
$("likes").textContent=likes;$("comments").textContent=comments;
}catch(e){$("name").textContent="Unable to load profile";$("status").textContent=e.code||e.message}}
load();
</script></body></html>
