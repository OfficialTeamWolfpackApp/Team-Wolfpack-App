<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060c12">
<meta name="description" content="Team Wolfpack supporter and sponsorship package posters.">
<title>Supporter &amp; Sponsor Packages | Team Wolfpack</title>
<style>
:root{color-scheme:dark;--ice:#00bfff;--fire:#ff741c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 0% 16%,rgba(0,191,255,.16),transparent 35%),radial-gradient(ellipse at 100% 80%,rgba(255,105,0,.14),transparent 36%),#05080d;color:#f4f9ff;font:15px/1.5 Arial,Helvetica,sans-serif}
.site-header{border-bottom:1px solid rgba(103,220,255,.24);background:rgba(5,11,17,.96)}
.header-inner{max-width:1100px;margin:auto;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{color:#fff;text-decoration:none;font-size:15px;font-weight:900;letter-spacing:1.5px}
.brand small{display:block;color:#9ec7d9;font-size:9px;letter-spacing:1.2px}
.header-links{display:flex;gap:12px;flex-wrap:wrap}
.header-links a{color:#d9f4ff;text-decoration:none;font-size:11px;font-weight:800}
.header-links a:hover{text-decoration:underline}
main{width:min(100%,1420px);margin:0 auto;padding:20px 12px 28px}
.poster{position:relative;isolation:isolate;width:100%;margin:0 auto 14px;padding:0;border:0;border-radius:10px;background:transparent;box-shadow:0 14px 36px rgba(0,0,0,.4)}
.poster::before{content:"";position:absolute;z-index:-1;inset:8% -2%;border-radius:30px;background:linear-gradient(130deg,rgba(0,191,255,.3),transparent 52%,rgba(255,105,0,.28));filter:blur(32px);pointer-events:none}
.poster img{display:block;width:100%;height:auto;border-radius:8px}
.poster a{display:block;cursor:zoom-in}
.poster a:focus-visible,.header-links a:focus-visible,.brand:focus-visible{outline:3px solid #67dcff;outline-offset:4px}
footer{text-align:center;color:#8ca4b1;font-size:11px;letter-spacing:1px;padding:0 15px 28px}
@media(max-width:600px){.header-inner{padding:13px 15px}.brand{font-size:13px}main{padding:9px 3px 16px}.poster{padding:0;margin-bottom:9px;border-radius:5px}.poster img{border-radius:4px}.poster::before{inset:10% 0;filter:blur(15px)}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="home.html">🐺 TEAM WOLFPACK<small>ONE PACK • ONE PURPOSE</small></a><nav class="header-links" aria-label="Page navigation"><a href="home.html">HOME</a><a href="sponsors.html">SPONSORS &amp; PARTNERS</a><a href="contact.html">CONTACT</a></nav></div></header>
<main aria-label="Team Wolfpack supporter and sponsorship package posters">
<figure class="poster"><a href="supporter-packages.png" target="_blank" rel="noopener" aria-label="Open full-size Team Wolfpack supporter packages poster"><img src="supporter-packages.png" alt="Team Wolfpack supporter packages poster showing Free, Pack, Loyal, Champion and Custom supporter options and their details" fetchpriority="high"></a></figure>
<figure class="poster"><a href="sponsorship-packages.png" target="_blank" rel="noopener" aria-label="Open full-size Team Wolfpack business sponsorship packages poster"><img src="sponsorship-packages.png" alt="Team Wolfpack sponsorship packages poster showing Bronze, Silver, Gold, Platinum and Custom business options and their details" loading="lazy"></a></figure>
</main>
<footer>© 2026 TEAM WOLFPACK • ONE PACK • ONE PURPOSE</footer>
</body>
</html>
