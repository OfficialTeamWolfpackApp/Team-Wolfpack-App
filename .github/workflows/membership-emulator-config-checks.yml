name: Membership emulator configuration checks
on:
  workflow_dispatch:
  push:
    branches: [feature/sponsorship-supporter-memberships]
    paths:
      - 'membership-backend/emulator/**'
      - '.github/workflows/membership-emulator-config-checks.yml'
  pull_request:
    paths:
      - 'membership-backend/emulator/**'
      - '.github/workflows/membership-emulator-config-checks.yml'
permissions:
  contents: read
jobs:
  static-emulator-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate test runner syntax and isolated emulator configuration
        working-directory: membership-backend/emulator
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee emulator-config-check.log
      - name: Upload emulator configuration check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: membership-emulator-config-check-log
          path: membership-backend/emulator/emulator-config-check.log
          if-no-files-found: warn
      - name: Verify fixture preparation script syntax
        run: node --check membership-backend/emulator/prepare-full-rules.js
