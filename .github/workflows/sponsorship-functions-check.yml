name: Sponsorship Functions - Safety Checks

on:
  push:
    branches:
      - development/sponsorship-integration
    paths:
      - "functions/**"
      - ".github/workflows/sponsorship-functions-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "functions/**"
      - ".github/workflows/sponsorship-functions-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    name: Check sponsorship function syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        working-directory: functions
        run: |
          node --check index.js
          node --check submit-sponsorship-application.js
          node --check submit-sponsorship-application.test.js
          node --check sponsorship-integration-safety.test.js
          node --check sponsor-link-consistency.review.js
          node --check sponsor-link-consistency.review.test.js
          node --check sponsor-operation-policy.review.js
          node --check sponsor-operation-policy.review.test.js
          node --check sponsor-link-transition.review.js
          node --check sponsor-link-transition.review.test.js
          node --check sponsor-transaction-model.review.js
          node --check sponsor-transaction-model.review.test.js
          node --check sponsor-transaction-adapter.review.js
          node --check sponsor-transaction-adapter.review.test.js
          node --check sponsor-transaction-result.review.js
          node --check sponsor-transaction-result.review.test.js
          node --check sponsor-legacy-inventory.review.js
          node --check sponsor-legacy-inventory.review.test.js
          node --check sponsor-auth-eligibility.review.js
          node --check sponsor-auth-eligibility.review.test.js
          node --check ../sponsorship-application.js
          node --check ../admin-sponsorship-enquiries.js

      - name: Run isolated mock security tests (no Firebase credentials)
        working-directory: functions
        run: node --test submit-sponsorship-application.test.js sponsorship-integration-safety.test.js sponsor-link-consistency.review.test.js sponsor-operation-policy.review.test.js sponsor-link-transition.review.test.js sponsor-transaction-model.review.test.js sponsor-transaction-adapter.review.test.js sponsor-transaction-result.review.test.js sponsor-legacy-inventory.review.test.js sponsor-auth-eligibility.review.test.js
