name: Sponsorship Isolated Emulator Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - development/sponsorship-integration
    paths:
      - 'functions/sponsor-emulator-smoke.review.js'
      - 'functions/sponsorship-emulator.review.json'
      - 'functions/sponsorship-emulator.review.rules.json'
      - '.github/workflows/sponsorship-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  emulator-smoke:
    if: github.ref == 'refs/heads/development/sponsorship-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-team-wolfpack-sponsorship-isolated
      FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:19130
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19131
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate isolated emulator configuration
        working-directory: functions
        run: |
          node --test sponsor-emulator-guard.review.test.js sponsor-emulator-config.review.test.js sponsor-emulator-startup.review.test.js
          node --check sponsor-emulator-smoke.review.js
          test -f functions/sponsorship-emulator.review.rules.json
      - name: Run test-only database emulator smoke
        run: |
          npx --yes firebase-tools@15.30.2 emulators:exec \
            --project demo-team-wolfpack-sponsorship-isolated \
            --config functions/sponsorship-emulator.review.json \
            --only database,auth \
            "node functions/sponsor-emulator-smoke.review.js"
